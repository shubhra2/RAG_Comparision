[lint]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
# 2. Enable import sorting (`I`) and moving inline imports to the top if possible (`ISC`)
select = ["E4", "E7", "E9", "F", "B", "I", "ISC"]

# 3. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 4. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 5. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[lint.isort]
# Treat the main package as first-party for import sorting.
known-first-party = ["rag_comparision"]

[format]
# 6. Use single quotes in `ruff format`.
quote-style = "single"
